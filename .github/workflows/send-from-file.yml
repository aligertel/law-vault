name: Send From File

on:
  workflow_dispatch:
    inputs:
      questions_file:
        description: 'مسیر فایل سوالات'
        required: false
        default: 'questions.txt'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@hajimirzamahmoud"
          QUESTIONS_FILE: ${{ github.event.inputs.questions_file }}
        run: python send_from_file.py
