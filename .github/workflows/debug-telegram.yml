name: Debug Telegram

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostics
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "=== getMe ===" > debug_output.txt
          curl -s "https://api.telegram.org/bot${TOKEN}/getMe" >> debug_output.txt
          echo "" >> debug_output.txt
          echo "=== getChat @hajimirzamahmoud ===" >> debug_output.txt
          curl -s "https://api.telegram.org/bot${TOKEN}/getChat?chat_id=@hajimirzamahmoud" >> debug_output.txt
          echo "" >> debug_output.txt
          echo "=== sendMessage test ===" >> debug_output.txt
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -H "Content-Type: application/json" -d '{"chat_id":"@hajimirzamahmoud","text":"تست تشخیصی از GitHub Actions"}' >> debug_output.txt
      - name: Commit result
        run: |
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"
          git add debug_output.txt
          git commit -m "Debug output" || echo "nothing to commit"
          git push
