name: Debug Telegram 2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python debug2.py
      - name: Commit result
        run: |
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"
          git add debug_output2.txt
          git commit -m "Debug output 2" || echo "nothing to commit"
          git push
