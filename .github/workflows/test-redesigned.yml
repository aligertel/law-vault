name: Test Redesigned Send

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          QUESTIONS_FILE: test_questions.txt
        run: python send_from_file.py > run_log.txt 2>&1 || echo "FAILED" >> run_log.txt
      - name: Commit result
        run: |
          git config user.name "diagnostic-bot"
          git config user.email "diagnostic-bot@users.noreply.github.com"
          git add run_log.txt
          git commit -m "Test run log" || echo "nothing to commit"
          git push
